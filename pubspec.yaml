name: flutter_performance_overlay
description: Um monitor e overlay de desempenho leve, arrastável e expansível para Flutter com métricas de FPS, UI/GPU build time, RAM, detecção de lag e suporte a agentes de IA via MCP.
version: 0.1.5
homepage: https://github.com/marcoazevedo01/flutter_performance_overlay
repository: https://github.com/marcoazevedo01/flutter_performance_overlay
issue_tracker: https://github.com/marcoazevedo01/flutter_performance_overlay/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

executables:
  perf_mcp_server:
